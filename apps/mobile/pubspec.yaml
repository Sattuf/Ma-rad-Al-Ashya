name: marad_mobile
description: "معرض الأشياء — Ma'rad Al-Ashya' C2C Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # OAuth
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # OTP Input
  pinput: ^5.0.1

  # Utilities
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
