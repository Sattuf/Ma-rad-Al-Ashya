name: marad_mobile
description: "معرض الأشياء — Ma'rad Al-Ashya' C2C Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # OAuth
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # OTP Input
  pinput: ^5.0.1

  # Utilities
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: any
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  carousel_slider: ^5.1.2
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  geocoding: ^4.0.0
  permission_handler: ^12.0.3
  easy_debounce: ^2.0.3
  socket_io_client: ^3.1.6
  firebase_messaging: ^16.3.0
  firebase_core: 4.10.0
  flutter_local_notifications: ^19.5.0
  photo_view: ^0.15.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
