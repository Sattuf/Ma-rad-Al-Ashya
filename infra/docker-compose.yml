# معرض الأشياء — Docker Compose (Development Environment)
# Sprint 0 / الأسبوع 2 — بيئة التطوير المحلية الكاملة
#
# الاستخدام:
#   docker compose -f infra/docker-compose.yml up -d                     → الخدمات الأساسية فقط
#   docker compose -f infra/docker-compose.yml --profile search up -d    → + Elasticsearch + Search Service
#   docker compose -f infra/docker-compose.yml --profile monitoring up -d → + Prometheus + Grafana + Loki + Alertmanager
#   docker compose -f infra/docker-compose.yml --profile identity up -d  → + LocalStack + Identity Service
#   docker compose -f infra/docker-compose.yml --profile ai up -d        → + Fraud + Personalization
#   docker compose -f infra/docker-compose.yml --profile all up -d       → كل شيء

# الأسرار تُقرأ من infra/.env (انسخ infra/.env.example) — Secrets come from infra/.env.
# There are deliberately no defaults: every service refuses to start without them.

services:

  # ============================================================================
  # مخازن البيانات — Data Stores
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: marad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marad_user
      POSTGRES_PASSWORD: marad_dev_password
      POSTGRES_DB: marad_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marad_user -d marad_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marad-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - marad-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: marad-elasticsearch
    restart: unless-stopped
    profiles: ["search", "all"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=marad-search
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - marad-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      # The JVM can take over a minute to start on a laptop; failures during this grace
      # period do not count, so search-service is not marked as failed before ES is up.
      start_period: 90s

  localstack:
    image: localstack/localstack:latest
    container_name: marad-localstack
    profiles: ["identity", "all"]
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=kms
      - DEFAULT_REGION=me-south-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - marad-network

  # ترحيلات قاعدة البيانات — runs db/migrations once, before any service that uses Postgres.
  migrate:
    image: node:20-alpine
    container_name: marad-migrate
    working_dir: /db
    command: sh -c "npm ci --omit=dev --no-audit --no-fund && node migrate.mjs"
    environment:
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
    volumes:
      - ../db:/db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marad-network

  # ============================================================================
  # خدمات NestJS المصغرة — NestJS Microservices
  # ============================================================================

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      target: builder
    container_name: marad-api-gateway
    restart: unless-stopped
    command: npm run start:dev
    environment:
      - PORT=3000
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:3001
      - LISTINGS_SERVICE_URL=http://listings-service:3002
      - SEARCH_SERVICE_URL=http://search-service:3003
      - MESSAGING_SERVICE_URL=http://messaging-service:3004
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:3005
      - IDENTITY_SERVICE_URL=http://identity-service:3006
      - USERS_SERVICE_URL=http://users-service:3007
      - MODERATION_SERVICE_URL=http://moderation-service:3008
      - FRAUD_SERVICE_URL=http://fraud-service:8001
      - PERSONALIZATION_SERVICE_URL=http://personalization-service:8002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Bearer token Prometheus uses to scrape the gateway's public /metrics.
      - METRICS_TOKEN=${METRICS_TOKEN:?set METRICS_TOKEN in infra/.env}
    ports:
      # DEVICE_BIND=0.0.0.0 in infra/.env exposes it on the Wi-Fi network (testing on a phone).
      - "${DEVICE_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ../services/api-gateway/src:/app/src:delegated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
      target: builder
    container_name: marad-auth-service
    restart: unless-stopped
    command: npm run start:dev
    environment:
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3001
      - NODE_ENV=development
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in infra/.env}
      - OTP_MOCK_ENABLED=true
      - TRUST_PROXY_HOPS=1
      - FRAUD_SERVICE_URL=http://fraud-service:8001
    volumes:
      - ../services/auth-service/src:/app/src:delegated
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  listings-service:
    build:
      context: ../services/listings-service
      dockerfile: Dockerfile
      target: builder
    container_name: marad-listings-service
    restart: unless-stopped
    command: npm run start:dev
    environment:
      # Public gateway address used in locally stored image URLs (set to your Wi-Fi IP for a phone).
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3000/api/v1}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3002
      - NODE_ENV=development
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - SEARCH_SERVICE_URL=http://search-service:3003
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:3005
      - PERSONALIZATION_SERVICE_URL=http://personalization-service:8002
      - S3_BUCKET=marad-listings-images
      - S3_REGION=me-south-1
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ../services/listings-service/src:/app/src:delegated
      # Uploaded photos (local storage, no S3) must outlive the container: a rebuild or
      # redeploy would otherwise delete every listing photo.
      - listings_media:/app/tmp/listings
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  search-service:
    build:
      context: ../services/search-service
      dockerfile: Dockerfile
      target: builder
    container_name: marad-search-service
    restart: unless-stopped
    profiles: ["search", "all"]
    command: npm run start:dev
    environment:
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3003
      - NODE_ENV=development
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      # Search clicks and A/B results are written to Postgres (ab_test_results).
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../services/search-service/src:/app/src:delegated
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  messaging-service:
    build:
      context: ../services/messaging-service
      dockerfile: Dockerfile
      target: builder
    container_name: marad-messaging-service
    restart: unless-stopped
    command: npm run start:dev
    environment:
      # Public gateway address used in locally stored image URLs (set to your Wi-Fi IP for a phone).
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3000/api/v1}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3004
      - NODE_ENV=development
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "${DEVICE_BIND:-127.0.0.1}:3004:3004"
    volumes:
      - ../services/messaging-service/src:/app/src:delegated
      - messages_media:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  transactions-service:
    build:
      context: ../services/transactions-service
      dockerfile: Dockerfile
      target: builder
    container_name: marad-transactions-service
    restart: unless-stopped
    command: npm run start:dev
    environment:
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3005
      - NODE_ENV=development
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LISTINGS_SERVICE_URL=http://listings-service:3002
      - FRAUD_SERVICE_URL=http://fraud-service:8001
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - ../services/transactions-service/src:/app/src:delegated
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  identity-service:
    build:
      context: ../services/identity-service
      dockerfile: Dockerfile
      target: builder
    container_name: marad-identity-service
    restart: unless-stopped
    profiles: ["identity", "all"]
    command: npm run start:dev
    environment:
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3006
      - NODE_ENV=development
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DIDIT_API_KEY=dev-didit-api-key
      - DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET:?set DIDIT_WEBHOOK_SECRET in infra/.env}
      - USERS_SERVICE_URL=http://users-service:3007
      - DIDIT_API_URL=https://api.didit.me
      - AWS_REGION=me-south-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - KMS_ENDPOINT=http://localstack:4566
    volumes:
      - ../services/identity-service/src:/app/src:delegated
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - marad-network

  users-service:
    build:
      context: ../services/users-service
      dockerfile: Dockerfile
      target: builder
    container_name: marad-users-service
    restart: unless-stopped
    command: npm run start:dev
    environment:
      # Public gateway address used in locally stored image URLs (set to your Wi-Fi IP for a phone).
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3000/api/v1}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3007
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=marad_user
      - DB_PASSWORD=marad_dev_password
      - DB_NAME=marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LISTINGS_SERVICE_URL=http://listings-service:3002
    ports:
      - "127.0.0.1:3007:3007"
    volumes:
      - ../services/users-service/src:/app/src:delegated
      - avatars_media:/app/tmp/avatars
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  moderation-service:
    build:
      context: ../services/moderation-service
      dockerfile: Dockerfile
    container_name: marad-moderation-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:3008"
    environment:
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=3008
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=marad_user
      - DB_PASSWORD=marad_dev_password
      - DB_NAME=marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LISTINGS_SERVICE_URL=http://listings-service:3002
      - USERS_SERVICE_URL=http://users-service:3007
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  # ============================================================================
  # خدمات Python — Python Services
  # ============================================================================

  fraud-service:
    build:
      context: ../services/fraud-service
      dockerfile: Dockerfile
    container_name: marad-fraud-service
    restart: unless-stopped
    profiles: ["ai", "all"]
    environment:
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=8001
      - ENV=development
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Admin "lock account" suspends through users-service.
      - USERS_SERVICE_URL=http://users-service:3007
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ../services/fraud-service/app:/app/app:delegated
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  personalization-service:
    build:
      context: ../services/personalization-service
      dockerfile: Dockerfile
    container_name: marad-personalization-service
    restart: unless-stopped
    profiles: ["ai", "all"]
    environment:
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      - PORT=8002
      - ENV=development
      - DATABASE_URL=postgresql://marad_user:marad_dev_password@postgres:5432/marad_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ../services/personalization-service/app:/app/app:delegated
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marad-network

  # ============================================================================
  # Monitoring & Observability
  # ============================================================================

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: marad-prometheus
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - marad-network

  grafana:
    image: grafana/grafana:latest
    container_name: marad-grafana
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    ports:
      # 3100 is the web app's dev port.
      - "127.0.0.1:3200:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - marad-network

  # Alerts from Prometheus → grouped, de-duplicated, sent to the team (see alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: marad-alertmanager
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Notifier secrets (Telegram token, SMTP password): files in infra/secrets/, not in git.
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    networks:
      - marad-network

  # Host metrics: disk space, memory, CPU.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: marad-node-exporter
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - marad-network

  # Loki runs as uid 10001 but a new volume is owned by root: hand it over once, before start.
  loki-init:
    image: busybox:1.37
    profiles: ["monitoring", "all"]
    command: ['chown', '-R', '10001:10001', '/loki']
    volumes:
      - loki_data:/loki

  # Log storage, queried from Grafana (Logs dashboard, Explore).
  loki:
    image: grafana/loki:3.6.0
    container_name: marad-loki
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    depends_on:
      loki-init:
        condition: service_completed_successfully
    networks:
      - marad-network

  # Collects the logs of every marad-* container and ships them to Loki.
  alloy:
    image: grafana/alloy:v1.11.0
    container_name: marad-alloy
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    command: ['run', '--storage.path=/var/lib/alloy', '/etc/alloy/config.alloy']
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to container logs and metadata.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki
    networks:
      - marad-network

# ============================================================================
# الشبكة والتخزين — Networks & Volumes
# ============================================================================

networks:
  marad-network:
    driver: bridge
    name: marad-network

secrets:
  # Read from infra/.env; Prometheus reads it as a file (it cannot expand env vars).
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  postgres_data:
    name: marad-postgres-data
  redis_data:
    name: marad-redis-data
  es_data:
    name: marad-es-data
  prometheus_data:
    name: marad-prometheus-data
  grafana_data:
    name: marad-grafana-data
  loki_data:
    name: marad-loki-data
  alloy_data:
    name: marad-alloy-data
  alertmanager_data:
    name: marad-alertmanager-data
  listings_media:
    name: marad-listings-media
  messages_media:
    name: marad-messages-media
  avatars_media:
    name: marad-avatars-media
