# Prometheus — scrape configuration.
# Service /metrics endpoints are internal (the gateway refuses to forward /metrics).
# The gateway listens publicly, so its /metrics needs the bearer token (METRICS_TOKEN).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# What pages someone, and why: alerts.yml (tested by alerts.test.yml).
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Request rate, errors, latency and health of every upstream, as seen by the gateway.
  - job_name: 'api-gateway'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api-gateway:3000']

  # Process metrics (CPU, memory, event loop, GC) of each service.
  - job_name: 'services'
    static_configs:
      - targets:
          - 'auth-service:3001'
          - 'listings-service:3002'
          - 'search-service:3003'
          - 'messaging-service:3004'
          - 'transactions-service:3005'
          - 'identity-service:3006'
          - 'users-service:3007'
          - 'moderation-service:3008'
          - 'fraud-service:8001'
          - 'personalization-service:8002'
    relabel_configs:
      # instance "auth-service:3001" → service="auth-service"
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: service

  # Host disk, memory and CPU (the DiskAlmostFull alert).
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
