[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-service"
version = "0.1.0"
description = "خدمة كشف الاحتيال — Fraud Detection Service for Ma'rad Al-Ashya'"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "scikit-learn==1.5.2",
    "numpy==2.1.0",
    "pandas==2.2.3",
    "pydantic==2.9.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "httpx==0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
